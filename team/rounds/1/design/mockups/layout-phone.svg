<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1500" width="390" height="1500" role="img" aria-label="Mock-up: the home page at 390 px wide"><rect x="0" y="0" width="390" height="1500" fill="#f7f7f4"/><rect x="0" y="0" width="390" height="92" fill="#ffe9a8"/><text x="16" y="20" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#332600">Simulation. This billboard does not exist: no screen,</text><text x="16" y="39" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#332600">campaign or booking is real. The Algarve weather is real,</text><text x="16" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#332600">read live from IPMA via data.promptugal.news; London's</text><text x="16" y="77" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#332600">weather is set by you; flights, prices ... Idea: Dinis Cruz.</text><rect x="0" y="92" width="390" height="48" fill="#ffffff"/><text x="16" y="122" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1f23">London billboard (a simulation)</text><text x="374" y="122" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b5c8a" text-anchor="end">Menu</text><g transform="translate(48 168) scale(0.2708333333333333)"><rect x="-24" y="-24" width="1128" height="1968" rx="30" fill="#111111"/><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8bd4"/><stop offset="1" stop-color="#bfe2f4"/></linearGradient><clipPath id="cg2"><rect x="0" y="0" width="1080" height="1920"/></clipPath></defs><g clip-path="url(#cg2)"><rect x="0" y="0" w