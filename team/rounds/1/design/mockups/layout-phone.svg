f" font-size="92" font-weight="800" fill="#ffffff">right now.</text><text x="64" y="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffd36b">You could be here.</text><rect x="64" y="1050" width="952" height="560" rx="28" fill="#0a1626" opacity="0.78"/><text x="112" y="1140" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Faro</text><text x="290" y="1140" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#e6e9ee">18:02 local time</text><text x="112" y="1340" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="180" font-weight="800" fill="#ffd36b">20.6°C</text><rect x="820" y="1207.88" width="149.60000000000002" height="54" rx="16.2" fill="#1f7a3f"/><circle cx="846" cy="1237.2" r="8" fill="#ffffff"/><text x="864" y="1250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">live</text><text x="112" y="1430" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#ffffff">IPMA today: partly cloudy, 6% chance of rain</text><text x="112" y="1490" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#e6e9ee">Observed at Faro (Aeródromo), 4 km, 17:00 UTC.</text><text x="112" y="1540" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#e6e9ee">Sea up to 19.8°C. 4 airliners near Faro (adsb.lol)</text><circle cx="500" cy="1640" r="11" fill="#ffffff" opacity="1"/><circle cx="540" cy="1640" r="11" fill="#e6e9ee" opacity="0.5"/><circle cx="580" cy="1640" r="11" fill="#e6e9ee" opacity="0.5"/><rect x